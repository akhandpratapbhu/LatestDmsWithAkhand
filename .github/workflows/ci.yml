name: CI

# On every push / PR: run npm run build in apps/api and apps/web.
# If either build fails, the workflow fails (red ✗). Both green = pass (✓).
#
# Jobs live in THIS file: .github/workflows/ci.yml
# To remove a check later: delete that job block, then remove it from ci-result needs.
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://dms:dms_secret@localhost:5432/dms?schema=public
  NODE_ENV: test

jobs:
  # Same as: cd apps/api && npm run build
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @dms/shared

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build API (apps/api → npm run build)
        working-directory: apps/api
        run: npm run build

      - name: Upload API dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 7

  # Same as: cd apps/web && npm run build
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @dms/shared

      - name: Build Web (apps/web → npm run build)
        working-directory: apps/web
        run: npm run build

      - name: Upload Web dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  docker:
    name: Docker build (verify)
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: dms-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: dms-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Green only if API + Web builds passed
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: always()
    steps:
      - name: Decide pass or fail
        run: |
          echo "Build API: ${{ needs.build-api.result }}"
          echo "Build Web: ${{ needs.build-web.result }}"

          if [ "${{ needs.build-api.result }}" != "success" ]; then
            echo "❌ apps/api build FAILED (npm run build)"
            exit 1
          fi
          if [ "${{ needs.build-web.result }}" != "success" ]; then
            echo "❌ apps/web build FAILED (npm run build)"
            exit 1
          fi

          echo "✅ API build + Web build PASSED"
