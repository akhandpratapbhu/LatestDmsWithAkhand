name: CI

# On every push / PR: run npm run build in apps/api and apps/web.
# If either build fails, the workflow fails (red ✗). Both green = pass (✓).
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://dms:dms_secret@localhost:5432/dms?schema=public
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long!!
  JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long!
  NODE_ENV: test
  APP_URL: http://localhost:5173
  PORT: 3000

jobs:
  # Same as: cd apps/api && npm run build
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @dms/shared

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build API (apps/api → npm run build)
        working-directory: apps/api
        run: npm run build

      - name: Upload API dist
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 7

  # Same as: cd apps/web && npm run build
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @dms/shared

      - name: Build Web (apps/web → npm run build)
        working-directory: apps/web
        run: npm run build

      - name: Upload Web dist
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck / lint workspaces
        run: |
          npm run build -w @dms/shared
          npm run lint -w @dms/api
          npm run lint -w @dms/web

  smoke:
    name: Auth smoke test
    runs-on: ubuntu-latest
    needs: [build-api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms_secret
          POSTGRES_DB: dms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dms -d dms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:push
          npm run build -w @dms/shared
          npm run build -w @dms/api

      - name: Start API
        run: |
          npm run start -w @dms/api &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health >/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          exit 1

      - name: Run smoke script
        run: bash scripts/ci-smoke.sh

  docker:
    name: Docker build (verify)
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: dms-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: dms-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single status used for branch protection: green only if API + Web builds passed
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [build-api, build-web, quality]
    if: always()
    steps:
      - name: Decide pass or fail
        run: |
          echo "Build API: ${{ needs.build-api.result }}"
          echo "Build Web: ${{ needs.build-web.result }}"
          echo "Lint & format: ${{ needs.quality.result }}"

          if [ "${{ needs.build-api.result }}" != "success" ]; then
            echo "❌ apps/api build FAILED (npm run build)"
            exit 1
          fi
          if [ "${{ needs.build-web.result }}" != "success" ]; then
            echo "❌ apps/web build FAILED (npm run build)"
            exit 1
          fi
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "❌ Lint/format FAILED"
            exit 1
          fi

          echo "✅ API build + Web build + lint all PASSED"
